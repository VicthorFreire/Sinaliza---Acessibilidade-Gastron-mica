<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio | Sinaliza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-pattern"></div>

    <nav class="navbar navbar-expand-lg glass-nav sticky-top mb-4">
        <div class="container-xl">
            <a class="navbar-brand d-flex align-items-center gap-3" href="../../index.html">
                <img src="../../assets/images/logo_tiaw.png" alt="Logo Sinaliza" class="shadow-sm" style="width: 48px; height: 48px; border-radius: 12px; object-fit: contain;">
                <span class="brand-text">Sinaliza<span class="text-primary">.</span></span>
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-4">
                    <li class="nav-item"><a class="nav-link fw-medium text-secondary" href="../../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link fw-medium text-secondary" href="../lista_restaurantes/index.html">Restaurantes</a></li>
                    <li class="nav-item"><a class="nav-link fw-medium text-secondary" href="../modo_garcom/index.html">Modo Garçom</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-xl pt-2 pb-5">
        <section class="text-center mb-5">
            <div class="badge-custom bg-white border px-3 py-1 rounded-pill text-primary fw-bold mb-3 d-inline-block shadow-sm">
                <i class="bi bi-shield-lock me-1"></i> Acesso Restrito ao Restaurante
            </div>
            <h2 class="fw-black display-5 text-dark mb-2" id="tituloPagina">Carregando...</h2>
            <p class="text-secondary fs-5">Cadastre e gerencie os pratos do seu estabelecimento.</p>
            <button class="btn-voltar mt-3" onclick="window.location.href='../painel_restaurante/index.html'">
                <i class="bi bi-arrow-left me-1"></i> Voltar ao Painel
            </button>
        </section>

        <div class="layout-grid">
            <div class="form-col">
                <div class="glass-card">
                    <h3 class="section-title" id="tituloFormulario"><i class="bi bi-plus-circle me-2 text-primary"></i>Novo Prato</h3>

                    <form id="formPrato" novalidate>
                        <input type="hidden" id="pratoId">

                        <div class="field-group">
                            <label for="nomePrato">Nome do prato</label>
                            <input type="text" id="nomePrato" placeholder="Ex: Pizza Margherita">
                        </div>

                        <div class="field-row">
                            <div class="field-group">
                                <label for="precoPrato">Preço (R$)</label>
                                <input type="number" id="precoPrato" placeholder="Ex: 45.00" step="0.01" min="0">
                            </div>
                            <div class="field-group">
                                <label for="categoriaPrato">Categoria</label>
                                <select id="categoriaPrato">
                                    <option value="">Selecione...</option>
                                    <option value="Entrada">🥗 Entrada</option>
                                    <option value="Prato Principal">🍽️ Prato Principal</option>
                                    <option value="Sobremesa">🍰 Sobremesa</option>
                                    <option value="Bebida">🥤 Bebida</option>
                                </select>
                            </div>
                        </div>

                        <div class="field-group area-ia">
                            <label for="descricaoPrato">Descrição do prato</label>
                            <textarea id="descricaoPrato" rows="3" placeholder="Escreva ou gere automaticamente..."></textarea>
                            <button type="button" id="btnGerarDescricao" class="btn-ia">
                                <i class="bi bi-stars me-1"></i> Gerar descrição automática
                            </button>
                            <p class="aviso-ia"><i class="bi bi-info-circle me-1"></i>A descrição pode ser editada antes de cadastrar.</p>
                        </div>

                        <div class="field-group">
                            <label for="imagemPrato">Foto do prato (opcional)</label>
                            <input type="file" id="imagemPrato" accept="image/*" class="file-input">
                        </div>

                        <button type="submit" class="btn-submit" id="btnSubmit">
                            <i class="bi bi-check-circle me-2"></i>Cadastrar Prato
                        </button>
                        <button type="button" class="btn-submit btn-cancelar" id="btnCancelarEdicao" style="display:none;" onclick="limparCampos()">
                            <i class="bi bi-x-circle me-2"></i>Cancelar Edição
                        </button>
                    </form>

                    <div id="mensagem" class="mensagem-feedback" aria-live="polite"></div>
                </div>
            </div>

            <div class="lista-col">
                <div class="lista-header">
                    <h3 class="section-title mb-0"><i class="bi bi-grid me-2 text-primary"></i>Meus Pratos</h3>
                    <div class="filtros">
                        <button class="filtro-btn active" data-cat="Todos">Todos</button>
                        <button class="filtro-btn" data-cat="Entrada">Entrada</button>
                        <button class="filtro-btn" data-cat="Prato Principal">Principal</button>
                        <button class="filtro-btn" data-cat="Sobremesa">Sobremesa</button>
                        <button class="filtro-btn" data-cat="Bebida">Bebida</button>
                    </div>
                </div>

                <div id="listaPratos" class="pratos-grid">
                    </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
