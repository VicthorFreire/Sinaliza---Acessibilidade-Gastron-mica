<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinaliza - Modo Garçom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-pattern"></div>
    
    <nav class="navbar navbar-expand-lg glass-nav sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html">
                <img src="../../assets/images/logo_tiaw.png" alt="Logo Sinaliza" class="shadow-sm" style="width: 44px; height: 44px; border-radius: 12px; object-fit: contain;">
                <span class="brand-text text-dark">Sinaliza<span class="text-primary">.</span></span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="../../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="../lista_restaurantes/index.html">Restaurantes</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold" href="#">Modo Garçom</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4 position-relative z-1">
        <header class="mb-5 text-center d-flex flex-column align-items-center">
            <div class="badge-custom mb-3">
                <i class="bi bi-chat-dots-fill text-primary"></i> Comunicação Rápida
            </div>
            <h1 class="section-title text-dark">Modo Garçom</h1>
            <div class="title-underline"></div>
            <p class="hero-subtitle">Selecione uma frase para se comunicar facilmente ou crie as suas próprias.</p>
        </header>

        <div class="row g-3 justify-content-center mb-5 mx-auto" style="max-width: 800px;">
            <div class="col-12 col-md-8">
                <div class="search-container w-100 h-100">
                    <div class="search-glow"></div>
                    <div class="search-box h-100">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" id="inputPesquisa" class="search-input" placeholder="Buscar frase, ex: 'Água'...">
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <button class="btn btn-dark rounded-4 w-100 h-100 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2" data-bs-toggle="modal" data-bs-target="#modalFrase" style="min-height: 56px;">
                    <i class="bi bi-plus-lg"></i> Nova Frase
                </button>
            </div>
        </div>

        <div class="mb-5 d-flex gap-3 flex-wrap justify-content-center pb-3" id="containerCategorias">
            <button class="btn btn-primary rounded-pill px-4 fw-medium text-nowrap flex-shrink-0 btn-categoria shadow-sm border-0" data-categoria="Todas">Todas</button>
        </div>

        <div class="row g-4" id="gridFrases"></div>
    </div>

    <div id="overlayTelaCheia" class="overlay-inativo">
        <button id="btnFecharOverlay" aria-label="Fechar tela cheia"><i class="bi bi-x-lg"></i></button>
        <div class="text-center p-4 content-overlay">
            <div id="overlayIcone" class="icone-overlay"></div>
            <h1 id="overlayTexto" class="texto-overlay"></h1>
        </div>
    </div>

    <div class="modal fade" id="modalFrase" tabindex="-1" aria-labelledby="modalFraseLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="modalFraseLabel">Adicionar Nova Frase</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="formFrase">
                    <div class="modal-body">
                        <input type="hidden" id="fraseId">
                        
                        <div class="mb-3">
                            <label class="form-label fw-medium">Ícone (Emoji)</label>
                            <input type="text" class="form-control rounded-3 form-control-lg" id="fraseIcone" placeholder="Ex: 🥩" maxlength="2" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Texto da Frase</label>
                            <textarea class="form-control rounded-3" id="fraseTexto" rows="3" placeholder="Ex: Gostaria da minha carne mal passada" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-light rounded-pill px-4 fw-bold" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Salvar Frase</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
