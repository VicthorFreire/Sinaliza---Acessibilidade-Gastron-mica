<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinaliza - O Meu Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-pattern min-vh-100 d-flex flex-column">

    <nav class="navbar navbar-expand-lg glass-nav sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html">
                <img src="../../assets/images/logo_tiaw.png" alt="Logo Sinaliza" class="shadow-sm" style="width: 44px; height: 44px; border-radius: 12px; object-fit: contain;">
                <span class="brand-text text-dark">Sinaliza<span class="text-primary">.</span> Perfil</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-outline-danger rounded-pill px-3" onclick="fazerLogout()">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </button>
            </div>
        </div>
    </nav>

    <div class="container flex-grow-1 pb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <header class="text-center mb-5">
                    <div class="avatar-circle bg-primary text-white mx-auto mb-3 shadow">
                        <i class="bi bi-person-fill" style="font-size: 3rem;"></i>
                    </div>
                    <h2 class="fw-bold" id="tituloNome">O Meu Perfil</h2>
                    <p class="text-secondary">Faça a gestão dos seus dados pessoais e palavra-passe.</p>
                </header>

                <div class="card glass-card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-4 p-md-5">
                        <form id="formCliente">
                            <div class="mb-3">
                                <label class="form-label fw-medium">Nome Completo</label>
                                <input type="text" class="form-control" id="clienteNome" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-medium">Email</label>
                                <input type="email" class="form-control" id="clienteEmail" required readonly title="O email não pode ser alterado">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-medium">Nova Palavra-passe</label>
                                <input type="password" class="form-control" id="clienteSenha" placeholder="Digite apenas se quiser alterar">
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary rounded-pill fw-bold py-2 shadow-sm">
                                    <i class="bi bi-floppy-fill me-2"></i> Guardar Alterações
                                </button>
                                <a href="../../index.html" class="btn btn-light rounded-pill fw-bold py-2 mt-2">
                                    <i class="bi bi-arrow-left me-2"></i> Voltar à Home
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    
    <script src="script.js"></script>
</body>
</html>
