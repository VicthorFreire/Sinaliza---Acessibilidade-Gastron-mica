<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinaliza - Painel do Restaurante</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-pattern min-vh-100 d-flex flex-column">

    <nav class="navbar navbar-expand-lg glass-nav sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html">
                <img src="../../assets/images/logo_tiaw.png" alt="Logo Sinaliza" class="shadow-sm" style="width: 44px; height: 44px; border-radius: 12px; object-fit: contain;">
                <span class="brand-text text-dark">Sinaliza<span class="text-primary">.</span> Painel</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="fw-medium text-secondary d-none d-md-block" id="nomeUsuarioLogado">Carregando...</span>
                <button class="btn btn-outline-danger rounded-pill px-3" onclick="fazerLogout()">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </button>
            </div>
        </div>
    </nav>

    <div class="container flex-grow-1 pb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                
                <header class="mb-4">
                    <h2 class="fw-bold">Gestão do Restaurante</h2>
                    <p class="text-secondary">Complete o perfil do seu estabelecimento para aparecer no mapa aos nossos utilizadores.</p>
                </header>

                <div class="card glass-card border-0 shadow-lg rounded-4 overflow-hidden">
                    
                    <ul class="nav nav-tabs nav-justified border-0 bg-light" id="painelTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-bold py-3 border-0" data-bs-toggle="tab" data-bs-target="#perfil-pane" type="button">1. Perfil e Localização</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-bold py-3 border-0" data-bs-toggle="tab" data-bs-target="#acesso-pane" type="button">2. Acessibilidade</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button id="btnTabCardapio" class="nav-link fw-bold py-3 border-0 text-primary" type="button">3. Cardápio <i class="bi bi-box-arrow-up-right ms-1"></i></button>
                        </li>
                    </ul>

                    <div class="card-body p-4 p-md-5">
                        <form id="formRestaurante" novalidate>
                            <input type="hidden" id="restauranteId"> <div class="tab-content">
                                <div class="tab-pane fade show active" id="perfil-pane" role="tabpanel">
                                    <div class="row g-3">
                                        <div class="col-md-8">
                                            <label class="form-label fw-medium">Nome do Restaurante</label>
                                            <input type="text" class="form-control" id="nomeRest" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label fw-medium">Especialidade</label>
                                            <select class="form-select" id="especialidadeRest" required>
                                                <option value="">Selecione...</option>
                                                <option value="Brasileira">Brasileira</option>
                                                <option value="Japonesa">Japonesa</option>
                                                <option value="Italiana">Italiana</option>
                                                <option value="Vegana">Vegana</option>
                                                <option value="Lanches">Lanches / Fast Food</option>
                                            </select>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label fw-medium">URL da Foto de Capa</label>
                                            <input type="url" class="form-control" id="fotoRest" placeholder="https://exemplo.com/foto.jpg">
                                        </div>
                                        <div class="col-md-9">
                                            <label class="form-label fw-medium">Endereço (Rua e Número)</label>
                                            <input type="text" class="form-control" id="enderecoRest" placeholder="Ex: Av. Afonso Pena, 1234" required>
                                        </div>
                                        <div class="col-md-3">
                                            <label class="form-label fw-medium">Cidade</label>
                                            <input type="text" class="form-control" id="cidadeRest" value="Belo Horizonte" required>
                                        </div>
                                        
                                        <div class="col-md-6 mt-4">
                                            <label class="form-label fw-medium text-primary"><i class="bi bi-geo-alt-fill"></i> Latitude (Google Maps)</label>
                                            <input type="text" class="form-control bg-primary-subtle border-primary" id="latRest" placeholder="-19.916681" required>
                                        </div>
                                        <div class="col-md-6 mt-4">
                                            <label class="form-label fw-medium text-primary"><i class="bi bi-geo-alt-fill"></i> Longitude (Google Maps)</label>
                                            <input type="text" class="form-control bg-primary-subtle border-primary" id="lngRest" placeholder="-43.934493" required>
                                        </div>
                                    </div>
                                    <div class="text-end mt-4">
                                        <button type="button" class="btn btn-dark rounded-pill px-4" onclick="document.querySelector('[data-bs-target=\'#acesso-pane\']').click()">Próximo Passo <i class="bi bi-arrow-right"></i></button>
                                    </div>
                                </div>

                                <div class="tab-pane fade" id="acesso-pane" role="tabpanel">
                                    <div class="alert alert-info border-0 rounded-4 mb-4">
                                        <i class="bi bi-info-circle-fill me-2"></i> Marque com honestidade as facilidades que o seu espaço oferece hoje.
                                    </div>

                                    <div class="row g-4">
                                        <div class="col-md-6">
                                            <div class="form-check form-switch fs-5">
                                                <input class="form-check-input" type="checkbox" id="chkLibras">
                                                <label class="form-check-label fw-medium ms-2" for="chkLibras">Atendimento em LIBRAS</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-check form-switch fs-5">
                                                <input class="form-check-input" type="checkbox" id="chkBraille">
                                                <label class="form-check-label fw-medium ms-2" for="chkBraille">Cardápio em Braille</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-check form-switch fs-5">
                                                <input class="form-check-input" type="checkbox" id="chkRampa">
                                                <label class="form-check-label fw-medium ms-2" for="chkRampa">Rampa de Acesso / Térreo</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-check form-switch fs-5">
                                                <input class="form-check-input" type="checkbox" id="chkVisual">
                                                <label class="form-check-label fw-medium ms-2" for="chkVisual">Sinalização Visual Clara</label>
                                            </div>
                                        </div>
                                    </div>

                                    <hr class="my-5">
                                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                                        <button type="button" class="btn btn-light rounded-pill px-4" onclick="document.querySelector('[data-bs-target=\'#perfil-pane\']').click()"><i class="bi bi-arrow-left"></i> Voltar</button>
                                        <div class="d-flex gap-2">
                                            <button type="button" id="btnVerPagina" class="btn btn-outline-dark rounded-pill px-4 fw-bold py-2 shadow-sm"><i class="bi bi-eye-fill me-2"></i> Ver Página Pública</button>
                                            <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold py-2 shadow"><i class="bi bi-floppy-fill me-2"></i> Guardar Perfil</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
